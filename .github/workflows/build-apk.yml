name: Build InstaCar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Encontrar projeto Gradle
        run: |
          echo "Procurando arquivos Gradle..."
          find . -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Gerar APK
        run: |
          GRADLE_FILE=$(find . -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) -type f | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERRO: nenhum build.gradle ou build.gradle.kts encontrado!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Projeto encontrado em: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaCar-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
